services:
  db:
    image: postgres:16-alpine
    container_name: fitness-db
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 볼륨이 비어 있는 최초 기동 시에만 파일명 순서대로 실행됨
      # 03_queries.sql은 UPDATE/DELETE가 있어 자동 실행하지 않음
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
